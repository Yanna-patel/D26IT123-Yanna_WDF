
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Events</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>

<header>

    <div class="header-top">

        <div class="logo">

            <img src="../images/logo.png" alt="StudentHub Logo">

            <h1>StudentHub</h1>

        </div>


        <div class="header-buttons">

            <a href="login.html">
                <button class="top-button">Login</button>
            </a>

            <a href="register.html">
                <button class="top-button">Register</button>
            </a>


            <label class="theme-switch"
                   for="themeBtn"
                   title="Toggle Dark/Light Mode">

                <input type="checkbox" id="themeBtn">

                <span class="slider">
                    <span class="slider-icon">🌙</span>
                </span>

            </label>

        </div>

    </div>


    <nav id="navigationMenu" aria-label="Main Navigation">

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <a href="dashboard.html">Dashboard</a>

        <a href="events.html">Events</a>

        <a href="student-profile.html">Profile</a>

        <a href="contact.html">Contact</a>

        <a href="admin-dashboard.html">Admin</a>

        <a href="faq.html">FAQ</a>

        <a href="feedback.html">Feedback</a>

    </nav>

</header>


<main>

    <section class="hero">
        

        <div class="hero-content">

            <h2>Campus Events</h2>

            <p>
                Stay connected with exciting activities.
            </p>

        </div>

    </section>


    <section class="container">

        <div class="event-heading">

            <h2>Campus Events</h2>


            <!-- Search -->

            <input
                type="text"
                id="searchEvent"
                placeholder="Search events..."
            >


            <!-- Category Filter -->

            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

            </select>


            <!-- Sorting -->

            <select id="sortEvents">

                <option value="default">
                    Sort Events
                </option>

                <option value="dateAsc">
                    Date: Earliest First
                </option>

                <option value="dateDesc">
                    Date: Latest First
                </option>

                <option value="titleAsc">
                    Title: A-Z
                </option>

                <option value="titleDesc">
                    Title: Z-A
                </option>

            </select>

        </div>


        <!-- Events will appear here -->

        <div class="cards" id="eventList"></div>

    </section>


    <!-- EVENT REGISTRATION MODAL -->

    <div id="eventRegistrationModal" class="modal">

        <div class="modal-content">

            <button
                type="button"
                id="closeEventForm"
                class="modal-close">

                ×

            </button>


            <h2>Event Registration</h2>


            <form id="eventRegistrationForm">


                <label for="eventName">
                    Event
                </label>

                <input
                    type="text"
                    id="eventName"
                    readonly
                >


                <label for="studentName">
                    Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >


                <label for="studentEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="studentEnrollment">
                    Enrollment Number
                </label>

                <input
                    type="text"
                    id="studentEnrollment"
                    placeholder="Enter your enrollment number"
                    required
                >


                <p id="eventFormMessage"></p>


                <button type="submit">
                    Submit Registration
                </button>


            </form>

        </div>

    </div>

</main>


<footer>

    <p>
        &copy; 2026 StudentHub
    </p>

</footer>


<script src="../javascript/script.js"></script>

<script src="../javascript/practical6.js"></script>
<script src="../javascript/dynamic-menu.js"></script>

</body>

</html>
