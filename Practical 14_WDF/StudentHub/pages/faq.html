
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | FAQ</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>
        <div class="header-top">

            <div class="logo">
                <img src="../images/logo.png" alt="StudentHub Logo">
                <h1>StudentHub</h1>
            </div>

            <div class="header-buttons">
                <a href="login.html">
                    <button class="top-button" type="button">Login</button>
                </a>

                <a href="register.html">
                    <button class="top-button" type="button">Register</button>
                </a>

                <label class="theme-switch"
                       for="themeBtn"
                       title="Toggle Dark/Light Mode">

                    <input type="checkbox" id="themeBtn">

                    <span class="slider">
                        <span class="slider-icon">🌙</span>
                    </span>
                </label>
            </div>

        </div>

        <nav id="navigationMenu" aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
            <a href="student-profile.html">Profile</a>
            <a href="contact.html">Contact</a>
            <a href="admin-dashboard.html">Admin</a>
            <a href="faq.html">FAQ</a>
            <a href="feedback.html">Feedback</a>
        </nav>
    </header>

    <main class="container">

        <h2>Frequently Asked Questions</h2>

        <div class="faq-controls">

            <input
                type="search"
                id="searchFAQ"
                placeholder="Search FAQs..."
                aria-label="Search FAQs">

            <select id="faqSort" aria-label="Sort FAQs">
                <option value="default">Default Order</option>
                <option value="az">Question: A–Z</option>
                <option value="za">Question: Z–A</option>
            </select>

        </div>

        <p id="faqResults"
           class="faq-results"
           aria-live="polite"></p>

        <div class="card" id="faqContainer">
            <p class="faq-empty">Loading FAQs...</p>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 StudentHub</p>
    </footer>

    <script src="../javascript/script.js"></script>
    <script src="../javascript/faq.js"></script>
    <script src="../javascript/dynamic-menu.js"></script>

</body>
</html>
