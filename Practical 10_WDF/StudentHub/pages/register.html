<header>

        <div class="logo">
            <img src="../images/logo.png" alt="StudentHub Logo">
            <h1>StudentHub</h1>
        </div>

        <div class="header-buttons">
            <a href="login.html">
                <button class="top-button">Login</button>
            </a>

            <a href="register.html">
                <button class="top-button">Register</button>
            </a>

            <label class="theme-switch" for="themeBtn" title="Toggle Dark/Light Mode">
                <input type="checkbox" id="themeBtn">
                <span class="slider">
                    <span class="slider-icon">🌙</span>
                </span>
            </label>
        </div>

    <nav aria-label="Main Navigation">
        <a href="index.html">Home</a>

    </nav>
</header>

<!-- Registration Form -->
<main class="container">

    <form action="../php/process_registration.php" method="POST">

        <h2>Student Registration</h2>

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="fullname"
            placeholder="Enter your name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="course">Course</label>
        <select id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="MCA">MCA</option>
        </select>

        <label for="role">Register As</label>
        <select id="role" name="role" required>
            <option value="">Select Role</option>
            <option value="Student">Student</option>
            <option value="Faculty">Faculty</option>
        </select>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <label for="confirm">Confirm Password</label>
        <input
            type="password"
            id="confirm"
            name="confirm_password"
            required
        >

        <button type="submit">Register</button>

    </form>

</main>

</body>
