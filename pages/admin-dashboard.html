<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>

        <div class="header-top">

            <div class="logo">
                <img src="../images/logo.png" alt="StudentHub Logo">
                <h1>StudentHub</h1>
            </div>

            <div class="header-buttons">

                <a href="login.html">
                    <button class="top-button">Login</button>
                </a>

                <a href="register.html">
                    <button class="top-button">Register</button>
                </a>

                <!-- Dark / Light Mode -->
                <label class="theme-switch" for="themeBtn" title="Toggle Dark/Light Mode">

                    <input type="checkbox" id="themeBtn">

                    <span class="slider">
                        <span class="slider-icon">🌙</span>
                    </span>

                </label>

            </div>

        </div>


        <!-- ================= NAVIGATION ================= -->
        <nav aria-label="Main Navigation">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
            <a href="student-profile.html">Profile</a>

        </nav>

    </header>


    <!-- ================= ADMIN DASHBOARD ================= -->
    <main class="container admin-dashboard">

        <div class="cards admin-cards">

                <h3>Students</h3>

            </div>

                <h3>Events</h3>
                <h2>15</h2>
            </div>

                <h3>Faculty</h3>
                <h2>120</h2>
            </div>

        </div>


        <!-- Recent Activities -->
        <div class="card recent-activities">

            <h3>Recent Activities</h3>

            <ul>

                <li>New Student Registered</li>
                <li>Faculty Added</li>
                <li>Workshop Updated</li>

            </ul>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer>

        <p>&copy; 2026 StudentHub</p>

    </footer>
