```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Feedback</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>

        <div class="header-top">

            <div class="logo">
                <img src="../images/logo.png" alt="StudentHub Logo">
                <h1>StudentHub</h1>
            </div>

            <div class="header-buttons">

                <a href="login.html">
                    <button class="top-button">Login</button>
                </a>

                <a href="register.html">
                    <button class="top-button">Register</button>
                </a>

                <!-- Dark / Light Mode -->
                <label class="theme-switch" for="themeBtn" title="Toggle Dark/Light Mode">

                    <input type="checkbox" id="themeBtn">

                    <span class="slider">
                        <span class="slider-icon">🌙</span>
                    </span>

                </label>

            </div>

        </div>


        <!-- ================= NAVIGATION ================= -->
        <nav aria-label="Main Navigation">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
            <a href="student-profile.html">Profile</a>
            <a href="contact.html">Contact</a>
            <a href="admin-dashboard.html">Admin</a>
            <a href="faq.html">FAQ</a>
            <a href="feedback.html">Feedback</a>

        </nav>

    </header>


    <!-- ================= FEEDBACK FORM ================= -->
    <main class="container">

        <form>

            <h2>Student Feedback</h2>

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <label for="feedback">Feedback</label>

            <textarea
                id="feedback"
                rows="6"
                placeholder="Write your feedback"
            ></textarea>

            <button type="submit">Submit Feedback</button>

        </form>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer>

        <p>&copy; 2026 StudentHub</p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="../javascript/script.js"></script>

</body>

</html>
```
