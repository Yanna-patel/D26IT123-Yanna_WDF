
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Student Profiles</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>
        <div class="header-top">

            <div class="logo">
                <img src="../images/logo.png" alt="StudentHub Logo">
                <h1>StudentHub</h1>
            </div>

            <div class="header-buttons">
                <a href="login.html">
                    <button class="top-button" type="button">Login</button>
                </a>

                <a href="register.html">
                    <button class="top-button" type="button">Register</button>
                </a>

                <label class="theme-switch"
                       for="themeBtn"
                       title="Toggle Dark/Light Mode">

                    <input type="checkbox" id="themeBtn">

                    <span class="slider">
                        <span class="slider-icon">🌙</span>
                    </span>
                </label>
            </div>
        </div>

        <nav aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
            <a href="student-profile.html">Profile</a>
            <a href="contact.html">Contact</a>
            <a href="admin-dashboard.html">Admin</a>
            <a href="faq.html">FAQ</a>
            <a href="feedback.html">Feedback</a>
        </nav>
    </header>

    <main class="container">

        <h2>Student Profiles</h2>

        <div class="student-controls">

            <input
                type="search"
                id="searchStudent"
                placeholder="Search by name, enrollment or email..."
                aria-label="Search students">

            <select id="departmentFilter"
                    aria-label="Filter by department">
                <option value="all">All Departments</option>
            </select>

            <select id="studentSort" aria-label="Sort students">
                <option value="default">Default Order</option>
                <option value="name-asc">Name: A–Z</option>
                <option value="name-desc">Name: Z–A</option>
                <option value="semester-asc">Semester: Low to High</option>
                <option value="semester-desc">Semester: High to Low</option>
            </select>

        </div>

        <p id="studentResults"
           class="student-results"
           aria-live="polite"></p>

        <div id="studentList" class="student-grid">
            <p>Loading student profiles...</p>
        </div>

        <div class="student-pagination" id="studentPagination">
            <button id="prevPage" type="button" disabled>
                Previous
            </button>

            <span id="pageInfo">Page 1</span>

            <button id="nextPage" type="button" disabled>
                Next
            </button>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 StudentHub</p>
    </footer>

    <script src="../javascript/script.js"></script>
    <script src="../javascript/student-profile.js"></script>

</body>
</html>
